name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.SIGN_KEY_STORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/key.jks"

      - name: Build Release APK
        env:
          SIGN_KEY_STORE_FILE: ${{ runner.temp }}/key.jks
          SIGN_KEY_STORE_PASSWORD: ${{ secrets.SIGN_KEY_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS || secrets.KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease

      - name: Parse build files
        id: apk
        run: |
          METADATA_FILE=$(find app/build -name "output-metadata.json" | grep "release" | head -n 1)
          APK_FILE=$(find app/build -name "*release*.apk" | head -n 1)
          if [ -z "$METADATA_FILE" ] || [ -z "$APK_FILE" ]; then
            echo "Failed to locate release APK or output-metadata.json" >&2
            exit 1
          fi

          versionName=$(jq -r '.elements[0].versionName' "$METADATA_FILE")
          versionCode=$(jq -r '.elements[0].versionCode' "$METADATA_FILE")

          mkdir -p outputs
          cp "$APK_FILE" "outputs/NodeFlow-${versionName}.apk"
          cp "$APK_FILE" "outputs/NodeFlow.apk"

          echo "versionName=$versionName" >> $GITHUB_OUTPUT
          echo "versionCode=$versionCode" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: NodeFlow ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            outputs/NodeFlow-*.apk
            outputs/NodeFlow.apk

      - name: Cleanup Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/key.jks"
