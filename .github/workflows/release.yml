name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.SIGN_KEY_STORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/key.jks"

      - name: Verify and build Release APK
        env:
          SIGN_KEY_STORE_FILE: ${{ runner.temp }}/key.jks
          SIGN_KEY_STORE_PASSWORD: ${{ secrets.SIGN_KEY_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS || secrets.KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest :image-hosting:test
          ./gradlew --no-daemon :app:assembleRelease

      - name: Parse build files
        run: |
          set -euo pipefail
          METADATA_FILE=app/build/outputs/apk/release/output-metadata.json
          versionName=$(jq -er '.elements[0].versionName' "$METADATA_FILE")
          APK_NAME=$(jq -er '.elements[0].outputFile' "$METADATA_FILE")
          APK_FILE="$(dirname "$METADATA_FILE")/$APK_NAME"

          mkdir -p outputs
          cp "$APK_FILE" "outputs/NodeFlow-${versionName}.apk"
          cp "$APK_FILE" "outputs/NodeFlow.apk"
          cp app/build/outputs/mapping/release/mapping.txt "outputs/NodeFlow-${versionName}-mapping.txt"

      - name: Upload R8 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NodeFlow-r8-${{ github.sha }}
          path: app/build/outputs/mapping/release/
          if-no-files-found: ignore
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: NodeFlow ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            outputs/NodeFlow-*.apk
            outputs/NodeFlow.apk
            outputs/NodeFlow-*-mapping.txt

      - name: Cleanup Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/key.jks"
