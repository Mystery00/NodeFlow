name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.SIGN_KEY_STORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/key.jks"

      - name: Verify and build Release app bundle
        env: &release_signing
          SIGN_KEY_STORE_FILE: ${{ runner.temp }}/key.jks
          SIGN_KEY_STORE_PASSWORD: ${{ secrets.SIGN_KEY_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS || secrets.KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest :image-hosting:test
          ./gradlew --no-daemon :app:bundleRelease

      - name: Download bundletool
        env:
          BUNDLETOOL_VERSION: '1.18.3'
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output bundletool.jar \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  bundletool.jar" | sha256sum --check

      - name: Generate signed universal APK from app bundle
        env: *release_signing
        run: |
          set -euo pipefail
          aab=app/build/outputs/bundle/release/app-release.aab
          bundletool="$RUNNER_TEMP/bundletool.jar"
          versionName=$(java -jar "$bundletool" dump manifest --bundle="$aab" --xpath='/manifest/@android:versionName')
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          printf '%s' "$SIGN_KEY_STORE_PASSWORD" > "$work/store.pass"
          printf '%s' "$SIGN_KEY_PASSWORD" > "$work/key.pass"
          java -jar "$bundletool" build-apks --bundle="$aab" --mode=universal --output="$work/release.apks" \
            --ks="$SIGN_KEY_STORE_FILE" --ks-key-alias="$SIGN_KEY_ALIAS" \
            --ks-pass="file:$work/store.pass" --key-pass="file:$work/key.pass"

          mkdir -p outputs
          cp "$aab" "outputs/NodeFlow-${versionName}.aab"
          unzip -p "$work/release.apks" universal.apk > "outputs/NodeFlow-${versionName}.apk"

      - name: Upload R8 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NodeFlow-r8-${{ github.sha }}
          path: app/build/outputs/mapping/release/
          if-no-files-found: ignore
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: NodeFlow ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          fail_on_unmatched_files: true
          files: |
            outputs/NodeFlow-*.aab
            outputs/NodeFlow-*.apk

      - name: Cleanup Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/key.jks"
