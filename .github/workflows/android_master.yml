name: Android Master CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ci skip')"
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.SIGN_KEY_STORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/key.jks"

      - name: Build with Gradle
        env:
          SIGN_KEY_STORE_FILE: ${{ runner.temp }}/key.jks
          SIGN_KEY_STORE_PASSWORD: ${{ secrets.SIGN_KEY_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS || secrets.KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleDebug

      - name: Parse build files
        id: apk
        run: |
          METADATA_FILE=$(find app/build -name "output-metadata.json" | grep "debug" | head -n 1)
          APK_FILE=$(find app/build -name "*debug*.apk" | head -n 1)
          if [ -z "$METADATA_FILE" ] || [ -z "$APK_FILE" ]; then
            echo "Failed to locate debug APK or output-metadata.json" >&2
            exit 1
          fi

          versionName=$(jq -r '.elements[0].versionName' "$METADATA_FILE")

          cp "$APK_FILE" "NodeFlow-debug-${versionName}.apk"
          echo "versionName=$versionName" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pre-${{ steps.apk.outputs.versionName }}
          name: NodeFlow Pre-release ${{ steps.apk.outputs.versionName }}
          prerelease: true
          body: |
            注意：该版本为测试版本，可能存在一些问题，不建议日常使用。
          files: NodeFlow-debug-${{ steps.apk.outputs.versionName }}.apk

      - name: Cleanup Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/key.jks"
