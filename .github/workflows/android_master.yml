name: Android Master CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'ci skip')
    outputs:
      versionName: ${{ steps.apk.outputs.versionName }}

    steps:
      - name: Set signing path
        run: printf 'SIGN_KEY_STORE_FILE=%s\n' "$RUNNER_TEMP/nodeflow-release.jks" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Decode release keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.SIGN_KEY_STORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SIGN_KEY_STORE_FILE"

      # PR 只构建 release 变体，不读取正式签名，也不创建预发布。
      - name: Generate temporary PR keystore
        if: github.event_name == 'pull_request'
        run: |
          umask 077
          keytool -genkeypair -noprompt -keystore "$SIGN_KEY_STORE_FILE" \
            -storetype PKCS12 -storepass nodeflow-ci -keypass nodeflow-ci \
            -alias nodeflow-ci -keyalg RSA -keysize 2048 -validity 2 \
            -dname 'CN=NodeFlow CI Test Only'

      - name: Build release APK
        env:
          SIGN_KEY_STORE_PASSWORD: ${{ github.event_name == 'pull_request' && 'nodeflow-ci' || secrets.SIGN_KEY_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ github.event_name == 'pull_request' && 'nodeflow-ci' || secrets.SIGN_KEY_ALIAS || secrets.KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ github.event_name == 'pull_request' && 'nodeflow-ci' || secrets.SIGN_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Collect release outputs
        id: apk
        run: |
          metadata=app/build/outputs/apk/release/output-metadata.json
          version_name=$(jq -r '.elements[0].versionName' "$metadata")
          output_file=$(jq -r '.elements[0].outputFile' "$metadata")

          mkdir -p outputs
          cp "app/build/outputs/apk/release/$output_file" "outputs/NodeFlow-release-${version_name}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "outputs/NodeFlow-${version_name}-mapping.txt"
          printf 'versionName=%s\n' "$version_name" >> "$GITHUB_OUTPUT"

      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/nodeflow-release.jks"

      - name: Upload R8 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NodeFlow-r8-${{ github.sha }}
          path: app/build/outputs/mapping/release/
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload release outputs
        uses: actions/upload-artifact@v4
        with:
          name: NodeFlow-release-${{ github.sha }}
          path: outputs/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    # 手动运行其他分支和 PR 只构建，不创建预发布。
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release outputs
        uses: actions/download-artifact@v4
        with:
          name: NodeFlow-release-${{ github.sha }}
          path: outputs

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pre-${{ needs.build.outputs.versionName }}
          target_commitish: ${{ github.sha }}
          name: NodeFlow Pre-release ${{ needs.build.outputs.versionName }}
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            注意：该版本为测试版本，可能存在一些问题，不建议日常使用。
            此 APK 使用正式密钥签名，已启用 release 混淆和资源压缩。
            原 debug 包签名不同，不能直接覆盖安装；卸载旧包前请注意本地数据会被清除。
          files: |
            outputs/NodeFlow-release-*.apk
            outputs/NodeFlow-*-mapping.txt
